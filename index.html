<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5132">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--g:#0f5132;--g2:#198754;--gl:#e8f5ee;--r:#b42318;--rl:#fdecea;--a:#b54708;--al:#fff4e5;--t:#1d2939;--m:#667085;--b:#e4e7ec;--bg:#f6f7f9}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit}
.wrap{max-width:760px;margin:0 auto;padding:12px 14px 90px}
header.top{background:var(--g);color:#fff;padding:12px 14px;position:sticky;top:0;z-index:5}
header.top .row{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-weight:800;letter-spacing:.3px}.brand small{display:block;font-weight:400;opacity:.85;font-size:12px}
.card{background:#fff;border:1px solid var(--b);border-radius:14px;padding:14px;margin:10px 0}
h2{font-size:17px;margin:4px 0 10px}h3{font-size:15px;margin:12px 0 6px}
label{display:block;font-size:13px;color:var(--m);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--b);border-radius:10px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g2);border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:10px;border:0;background:var(--g2);color:#fff;font-weight:600;cursor:pointer}
.btn.full{width:100%}.btn.sec{background:#fff;color:var(--t);border:1px solid var(--b)}.btn.red{background:var(--r)}.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.6}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:10px;border:1px solid var(--b);border-radius:10px;background:#fff;cursor:pointer;font-weight:600}
.seg button.on.in{background:var(--gl);border-color:var(--g2);color:var(--g)}.seg button.on.out{background:var(--rl);border-color:var(--r);color:var(--r)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:#fff;border:1px solid var(--b);border-radius:12px;padding:10px}.kpi .l{font-size:12px;color:var(--m)}.kpi .v{font-size:18px;font-weight:700}
.big{font-size:26px;font-weight:800;color:var(--g)}
.muted{color:var(--m);font-size:13px}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.tag.in{background:var(--gl);color:var(--g)}.tag.out{background:var(--rl);color:var(--r)}.tag.w{background:var(--al);color:var(--a)}
.list .it{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--b)}
.list .it:last-child{border:0}.amt{font-weight:700;white-space:nowrap}.amt.in{color:var(--g2)}.amt.out{color:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 6px;border-bottom:1px solid var(--b);text-align:left}th{color:var(--m);font-weight:600}td.n,th.n{text-align:right}
.tblw{overflow-x:auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--b);display:flex;justify-content:center;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;max-width:760px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:9px 2px 10px;font-size:11.5px;color:var(--m);cursor:pointer}
nav.tabs button b{display:block;font-size:18px}
nav.tabs button.on{color:var(--g);font-weight:700}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#101828;color:#fff;padding:10px 14px;border-radius:10px;z-index:50;max-width:90%;display:none}
.modal{position:fixed;inset:0;background:rgba(16,24,40,.55);display:none;align-items:flex-end;justify-content:center;z-index:40}
.modal .box{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px;max-height:90vh;overflow:auto}
@media(min-width:640px){.modal{align-items:center}.modal .box{border-radius:16px}}
.hide{display:none!important}
.alert{padding:10px 12px;border-radius:10px;font-size:13px}.alert.w{background:var(--al);color:var(--a)}.alert.ok{background:var(--gl);color:var(--g)}.alert.e{background:var(--rl);color:var(--r)}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.wrapf{flex-wrap:wrap}
.code{font:700 22px/1 ui-monospace,monospace;letter-spacing:3px;background:var(--gl);color:var(--g);padding:10px 14px;border-radius:10px;display:inline-block}
.photo{width:100%;border-radius:10px;margin-top:6px}
@media print{header.top,nav.tabs,.noprint,.btn{display:none!important}.wrap{padding:0}.card{border:0}}
</style>
</head>
<body>
<header class="top"><div class="row">
  <div class="brand">KasJaga<small id="bizName">Kas di tangan karyawan, kendali di tangan owner</small></div>
  <div class="row"><span id="whoami" class="muted" style="color:#d1fadf"></span><button id="btnOut" class="btn sm sec hide" onclick="logout()">Keluar</button></div>
</div></header>

<main class="wrap" id="app"></main>
<nav class="tabs hide" id="tabs"><div class="in" id="tabsIn"></div></nav>
<div class="toast" id="toast"></div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="box" id="modalBox"></div></div>

<script>
const SUPABASE_URL='https://fshsvlcjyrbydcsriczm.supabase.co';
const SUPABASE_KEY='sb_publishable_DHIIv3j-KKU2UTyBWkwNwQ_r7uccK7H';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const METHODS={tunai:'Tunai',transfer:'Transfer bank',qris:'QRIS',edc:'EDC/Kartu',ewallet:'E-wallet',dana:'DANA',grab:'Grab',gojek:'Gojek',lainnya:'Lainnya'};
const S={user:null,mems:[],biz:null,role:null,cats:[],members:[],tab:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>{const v=Number(n||0);return (v<0?'−':'')+'Rp'+Math.abs(v).toLocaleString('id-ID',{maximumFractionDigits:0})};
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta'}).format(new Date());
const addDays=(d,n)=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const fmtD=d=>new Date(d+'T00:00:00').toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const fmtT=t=>new Date(t).toLocaleString('id-ID',{timeZone:'Asia/Jakarta',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const num=v=>Number(String(v||'').replace(/[^\d]/g,''))||0;
function toast(m,ms=2600){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',ms)}
function openModal(h){$('#modalBox').innerHTML=h;$('#modal').style.display='flex'}
function closeModal(){$('#modal').style.display='none'}
function confirmBox(msg,okLabel='Ya, lanjut',danger=true){return new Promise(res=>{openModal(`<h2>Konfirmasi</h2><p>${msg}</p><div class="row" style="justify-content:flex-end"><button class="btn sec" id="cNo">Batal</button><button class="btn ${danger?'red':''}" id="cYes">${okLabel}</button></div>`);$('#cNo').onclick=()=>{closeModal();res(false)};$('#cYes').onclick=()=>{closeModal();res(true)}})}
function errMsg(e){const m=(e&&(e.message||e.error_description))||String(e);
  if(/Invalid login/i.test(m))return 'Email atau password salah.';
  if(/already registered/i.test(m))return 'Email sudah terdaftar. Silakan masuk.';
  if(/Password should be/i.test(m))return 'Password minimal 6 karakter.';
  if(/row-level security/i.test(m))return 'Anda tidak punya akses untuk tindakan ini.';
  return m}
function moneyInput(el){el.addEventListener('input',()=>{const n=num(el.value);el.value=n?n.toLocaleString('id-ID'):''})}

/* ---------- AUTH ---------- */
function viewAuth(mode='login'){
  $('#tabs').classList.add('hide');$('#btnOut').classList.add('hide');$('#whoami').textContent='';
  $('#app').innerHTML=`<div class="card" style="margin-top:24px">
  <h2>${mode==='login'?'Masuk ke KasJaga':'Daftar akun baru'}</h2>
  <p class="muted">${mode==='login'?'Owner dan staf masuk lewat halaman yang sama.':'Owner: daftar lalu masukkan kode aktivasi dari email pembelian. Staf: daftar lalu masukkan kode usaha dari owner.'}</p>
  <label>Email</label><input id="aEmail" type="email" autocomplete="email" placeholder="nama@email.com">
  <label>Password</label><input id="aPass" type="password" autocomplete="${mode==='login'?'current-password':'new-password'}" placeholder="minimal 6 karakter">
  <div style="height:12px"></div>
  <button class="btn full" id="aBtn">${mode==='login'?'Masuk':'Daftar'}</button>
  <p class="muted" style="text-align:center;margin-top:12px">${mode==='login'?'Belum punya akun? <a href="#" id="aSw">Daftar</a>':'Sudah punya akun? <a href="#" id="aSw">Masuk</a>'}</p>
  </div>`;
  $('#aSw').onclick=e=>{e.preventDefault();viewAuth(mode==='login'?'signup':'login')};
  $('#aBtn').onclick=async()=>{const email=$('#aEmail').value.trim(),password=$('#aPass').value;
    if(!email||!password)return toast('Isi email dan password');
    $('#aBtn').disabled=true;
    const r=mode==='login'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});
    $('#aBtn').disabled=false;
    if(r.error)return toast(errMsg(r.error));
    if(mode==='signup'&&!r.data.session)return toast('Cek email Anda untuk konfirmasi, lalu masuk.',5000);
    boot()};
}
async function logout(){await sb.auth.signOut();S.biz=null;viewAuth()}

/* ---------- ONBOARD ---------- */
function viewOnboard(){
  $('#tabs').classList.add('hide');
  $('#app').innerHTML=`<div class="card"><h2>Selamat datang 👋</h2><p class="muted">Akun Anda belum terhubung ke usaha mana pun. Pilih salah satu:</p></div>
  <div class="card"><h3>Saya OWNER (pembeli KasJaga)</h3>
   <label>Kode aktivasi (dari email/WA pembelian)</label><input id="oCode" placeholder="KJ-XXXX-XXXX" style="text-transform:uppercase">
   <label>Nama usaha</label><input id="oBiz" placeholder="cth. Warung Kopi Senja">
   <label>Nama Anda</label><input id="oName" placeholder="cth. Pak Emir">
   <label>Saldo kas tunai saat ini (uang di laci/brankas)</label><input id="oOpen" inputmode="numeric" placeholder="0">
   <div style="height:12px"></div><button class="btn full" id="oBtn">Aktifkan usaha</button></div>
  <div class="card"><h3>Saya STAF (kasir/karyawan/keuangan)</h3>
   <label>Kode usaha (minta ke owner)</label><input id="sCode" placeholder="8 karakter" style="text-transform:uppercase">
   <label>Nama Anda</label><input id="sName" placeholder="cth. Rina (kasir)">
   <div style="height:12px"></div><button class="btn full sec" id="sBtn">Gabung ke usaha</button></div>`;
  moneyInput($('#oOpen'));
  $('#oBtn').onclick=async()=>{const c=$('#oCode').value.trim(),b=$('#oBiz').value.trim(),n=$('#oName').value.trim();
    if(!c||!b||!n)return toast('Lengkapi kode, nama usaha, dan nama Anda');
    const {error}=await sb.rpc('activate_business',{license_code:c,biz_name:b,owner_name:n,opening:num($('#oOpen').value)});
    if(error)return toast(errMsg(error));toast('Usaha aktif!');boot()};
  $('#sBtn').onclick=async()=>{const c=$('#sCode').value.trim(),n=$('#sName').value.trim();
    if(!c||!n)return toast('Isi kode usaha dan nama Anda');
    const {error}=await sb.rpc('join_business',{code:c,staff_name:n});
    if(error)return toast(errMsg(error));toast('Berhasil bergabung');boot()};
}

/* ---------- BOOT ---------- */
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return viewAuth();
  S.user=session.user;$('#btnOut').classList.remove('hide');
  const {data,error}=await sb.from('members').select('business_id,role,display_name,active,businesses(id,name,join_code,opening_cash,start_date,staff_quota)').eq('user_id',S.user.id);
  if(error)return toast(errMsg(error));
  S.mems=(data||[]).filter(m=>m.active);
  if(!S.mems.length){ if((data||[]).length){$('#app').innerHTML='<div class="card"><h2>Akses dinonaktifkan</h2><p class="muted">Akun Anda dinonaktifkan oleh owner. Hubungi owner usaha.</p></div>';return} return viewOnboard();}
  const saved=localStorage.getItem('kj_biz');
  const m=S.mems.find(x=>x.business_id===saved)||S.mems[0];
  await selectBiz(m.business_id);
}
async function selectBiz(id){
  const m=S.mems.find(x=>x.business_id===id);S.biz=m.businesses;S.role=m.role;S.me=m.display_name;
  try{localStorage.setItem('kj_biz',id)}catch(e){}
  $('#bizName').textContent=S.biz.name+(S.mems.length>1?' ▾':'');$('#bizName').onclick=S.mems.length>1?pickBiz:null;
  $('#whoami').textContent=S.me+(S.role==='owner'?' · Owner':' · Staf');
  const {data:cats}=await sb.from('categories').select('*').eq('business_id',id).order('name');S.cats=cats||[];
  if(S.role==='owner'){const {data:mm}=await sb.from('members').select('user_id,display_name,role,active').eq('business_id',id);S.members=mm||[]}
  else S.members=[{user_id:S.user.id,display_name:S.me}];
  buildTabs();
}
function pickBiz(){openModal(`<h2>Pilih usaha</h2>${S.mems.map(m=>`<button class="btn sec full" style="margin:4px 0" onclick="closeModal();selectBiz('${m.business_id}')">${esc(m.businesses.name)} · ${m.role==='owner'?'Owner':'Staf'}</button>`).join('')}`)}
const nameOf=uid=>(S.members.find(m=>m.user_id===uid)||{}).display_name||'—';
const catName=id=>(S.cats.find(c=>c.id===id)||{}).name||'—';

function buildTabs(){
  const T=S.role==='owner'
   ?[['dash','🏠','Ringkasan'],['catat','➕','Catat'],['trx','📋','Transaksi'],['tutup','🔒','Tutup Kas'],['lap','📊','Laporan'],['tim','👥','Tim']]
   :[['catat','➕','Catat'],['hari','📋','Hari ini'],['tutup','🔒','Tutup Kas']];
  $('#tabsIn').innerHTML=T.map(t=>`<button data-t="${t[0]}"><b>${t[1]}</b>${t[2]}</button>`).join('');
  $('#tabs').classList.remove('hide');
  document.querySelectorAll('#tabsIn button').forEach(b=>b.onclick=()=>go(b.dataset.t));
  go(S.role==='owner'?'dash':'catat');
}
function go(t){S.tab=t;document.querySelectorAll('#tabsIn button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));window.scrollTo(0,0);
  ({dash:viewDash,catat:()=>viewCatat(),trx:viewTrx,tutup:viewTutup,lap:viewLap,tim:viewTim,hari:viewHari})[t]()}

/* ---------- CATAT ---------- */
async function compressImage(file){
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)});
  const max=1280,sc=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,'image/jpeg',.72));
}
function viewCatat(edit){
  const t=edit||{direction:'out',method:'tunai'};const owner=S.role==='owner';
  const html=`<div class="card"><h2>${edit?'Ubah transaksi':'Catat transaksi'}</h2>
  <div class="seg"><button data-d="in" class="in">⬇ Uang masuk</button><button data-d="out" class="out">⬆ Uang keluar</button></div>
  <label>Nominal (Rp)</label><input id="fAmt" inputmode="numeric" placeholder="0" value="${t.amount?Number(t.amount).toLocaleString('id-ID'):''}" style="font-size:20px;font-weight:700">
  <label>Metode</label><select id="fMet">${Object.entries(METHODS).map(([k,v])=>`<option value="${k}" ${t.method===k?'selected':''}>${v}</option>`).join('')}</select>
  <div id="accW"><label>Rekening/akun (opsional)</label><input id="fAcc" placeholder="cth. BCA 123, QRIS toko, OVO" value="${esc(t.account||'')}"></div>
  <label>Objek transaksi (apa yang dibeli/dijual)</label><input id="fObj" placeholder="cth. Beli gas 3 tabung" value="${esc(t.object||'')}">
  <label>Kategori</label><select id="fCat"></select>
  <label id="lCp">Dari/kepada siapa (pihak lain)</label><input id="fCp" placeholder="cth. Toko Sumber Rejeki / Pelanggan" value="${esc(t.counterparty||'')}">
  <label>Siapa yang bertransaksi</label><input id="fActor" placeholder="cth. Budi (karyawan dapur)" value="${esc(t.actor_name||(edit?'':S.me))}">
  ${owner?`<label>Tanggal</label><input id="fDate" type="date" value="${t.trx_date||today()}" max="${today()}">`:''}
  <label>Keterangan (opsional)</label><textarea id="fNote" rows="2">${esc(t.note||'')}</textarea>
  <label id="lPh">Foto bukti/nota</label><input id="fPh" type="file" accept="image/*" capture="environment">
  <div id="phInfo" class="muted"></div>
  <div style="height:12px"></div><button class="btn full" id="fSave">${edit?'Simpan perubahan':'Simpan transaksi'}</button>
  ${edit?'<div style="height:8px"></div><button class="btn full sec" onclick="closeModal()">Batal</button>':''}</div>`;
  if(edit)openModal(html);else $('#app').innerHTML=html;
  let dir=t.direction;
  const setDir=d=>{dir=d;document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.d===d));
    $('#fCat').innerHTML=S.cats.filter(c=>c.direction===d).map(c=>`<option value="${c.id}" ${t.category_id===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
    $('#lCp').textContent=d==='in'?'Diterima dari siapa':'Dibayar kepada siapa';
    $('#lPh').textContent='Foto bukti/nota'+(d==='out'&&!owner&&!t.proof_path?' (WAJIB)':' (opsional)')};
  document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>setDir(b.dataset.d));setDir(dir);
  const accT=()=>$('#accW').classList.toggle('hide',$('#fMet').value==='tunai');$('#fMet').onchange=accT;accT();
  moneyInput($('#fAmt'));
  if(t.proof_path)$('#phInfo').textContent='Sudah ada foto bukti. Pilih file baru untuk mengganti.';
  $('#fSave').onclick=async()=>{
    const amount=num($('#fAmt').value),object=$('#fObj').value.trim(),file=$('#fPh').files[0];
    if(!amount)return toast('Isi nominal');if(!object)return toast('Isi objek transaksi');
    if(dir==='out'&&!owner&&!file&&!t.proof_path)return toast('Foto bukti wajib untuk uang keluar');
    const btn=$('#fSave');btn.disabled=true;btn.textContent='Menyimpan...';
    try{
      let proof_path=t.proof_path||null;
      if(file){const blob=await compressImage(file);proof_path=`${S.biz.id}/${crypto.randomUUID()}.jpg`;
        const up=await sb.storage.from('proofs').upload(proof_path,blob,{contentType:'image/jpeg'});if(up.error)throw up.error}
      const row={business_id:S.biz.id,direction:dir,method:$('#fMet').value,account:$('#fMet').value==='tunai'?null:($('#fAcc').value.trim()||null),
        amount,object,category_id:$('#fCat').value||null,counterparty:$('#fCp').value.trim()||null,actor_name:$('#fActor').value.trim()||null,
        note:$('#fNote').value.trim()||null,proof_path};
      if(owner)row.trx_date=$('#fDate').value||today();
      const r=edit?await sb.from('transactions').update(row).eq('id',t.id):await sb.from('transactions').insert(row);
      if(r.error)throw r.error;
      toast(edit?'Perubahan tersimpan':'Transaksi tersimpan ✓');
      if(edit){closeModal();go(S.tab)}else viewCatat();
    }catch(e){toast(errMsg(e))}finally{btn.disabled=false}
  };
}

/* ---------- STAF: HARI INI ---------- */
async function viewHari(){
  $('#app').innerHTML='<div class="card"><h2>Catatan saya hari ini</h2><div id="lst" class="list muted">Memuat...</div></div>';
  const {data,error}=await sb.from('transactions').select('*').eq('business_id',S.biz.id).eq('trx_date',today()).order('created_at',{ascending:false});
  if(error)return toast(errMsg(error));
  $('#lst').classList.remove('muted');
  $('#lst').innerHTML=(data||[]).length?data.map(trxRow).join(''):'<p class="muted">Belum ada catatan hari ini.</p>';
  $('#lst').insertAdjacentHTML('afterend','<p class="muted">Salah catat? Minta owner untuk mengubah atau menghapus. Staf tidak bisa mengubah transaksi.</p>');
}
function trxRow(t){return `<div class="it"><div><div><span class="tag ${t.direction}">${t.direction==='in'?'Masuk':'Keluar'}</span> <b>${esc(t.object)}</b></div>
 <div class="muted">${METHODS[t.method]}${t.account?' · '+esc(t.account):''} · ${fmtT(t.created_at)}${t.proof_path?' · 📎':''}</div></div>
 <div class="amt ${t.direction}">${t.direction==='in'?'+':'−'}${rp(t.amount)}</div></div>`}

/* ---------- OWNER: DASHBOARD ---------- */
async function viewDash(){
  const d=today();
  $('#app').innerHTML=`<div class="card"><div class="muted">${fmtD(d)}</div><h2>Posisi kas tunai hari ini</h2><div id="cash">Memuat...</div></div>
  <div class="card"><h2>Non-tunai hari ini</h2><div id="nt">Memuat...</div></div>

async function loadLap(){
  let F=$('#rF').value;const T=$('#rT').value;if(F>T)return toast('Tanggal awal melewati tanggal akhir');
  if(F<S.biz.start_date){F=S.biz.start_date;$('#rF').value=F}
  if(F>T)return toast('Usaha baru aktif sejak '+fmtD(S.biz.start_date));
  $('#rep').innerHTML='<div class="card muted">Menyusun laporan...</div>';
  const [{data:cp,error:e1},{data:tx,error:e2},{data:cl}]=await Promise.all([
    sb.rpc('owner_cash_position',{bid:S.biz.id,d:F}),
    sb.from('transactions').select('*').eq('business_id',S.biz.id).gte('trx_date',F).lte('trx_date',T).order('trx_date').order('created_at'),
    sb.from('cash_closings').select('*').eq('business_id',S.biz.id).gte('close_date',F).lte('close_date',T)]);
  if(e1||e2)return toast(errMsg(e1||e2));S._rep=tx;
  const sum=(a,f)=>a.filter(f).reduce((s,t)=>s+Number(t.amount),0);
  const tin=sum(tx,t=>t.direction==='in'),tout=sum(tx,t=>t.direction==='out');
  // cash book
  let op=Number(cp[0].opening),rows=[],diffTot=0;
  for(let day=F;day<=T;day=addDays(day,1)){
    const ci=sum(tx,t=>t.trx_date===day&&t.method==='tunai'&&t.direction==='in'),co=sum(tx,t=>t.trx_date===day&&t.method==='tunai'&&t.direction==='out');
    const ex=op+ci-co,c=(cl||[]).find(x=>x.close_date===day);
    rows.push({day,op,ci,co,ex,c});if(c)diffTot+=Number(c.diff);op=c?Number(c.counted):ex;
    if(rows.length>370)break}
  const grp=(keyf)=>{const g={};tx.forEach(t=>{const k=keyf(t);g[k]=g[k]||{in:0,out:0,n:0};g[k][t.direction]+=Number(t.amount);g[k].n++});return Object.entries(g).sort((a,b)=>(b[1].in+b[1].out)-(a[1].in+a[1].out))};
  const tbl=(title,entries)=>`<div class="card"><h2>${title}</h2><div class="tblw"><table><tr><th></th><th class="n">Trx</th><th class="n">Masuk</th><th class="n">Keluar</th></tr>${entries.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${v.n}</td><td class="n amt in">${rp(v.in)}</td><td class="n amt out">${rp(v.out)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Tidak ada data</td></tr>'}</table></div></div>`;
  const noProof=tx.filter(t=>t.direction==='out'&&!t.proof_path).length,unrec=tx.filter(t=>t.method!=='tunai'&&!t.reconciled).length;
  $('#rep').innerHTML=`<div class="card"><div class="muted">${esc(S.biz.name)} · ${fmtD(F)} – ${fmtD(T)}</div><h2>Ringkasan</h2>
   <div class="grid2"><div class="kpi"><div class="l">Total masuk</div><div class="v amt in">${rp(tin)}</div></div><div class="kpi"><div class="l">Total keluar</div><div class="v amt out">${rp(tout)}</div></div>
   <div class="kpi"><div class="l">Selisih masuk − keluar</div><div class="v">${rp(tin-tout)}</div></div><div class="kpi"><div class="l">Saldo tunai akhir</div><div class="v" style="color:var(--g)">${rp(rows.length?(rows[rows.length-1].c?rows[rows.length-1].c.counted:rows[rows.length-1].ex):0)}</div></div>
   <div class="kpi"><div class="l">Total selisih tutup kas</div><div class="v" style="color:${diffTot<0?'var(--r)':(diffTot>0?'var(--a)':'var(--g2)')}">${rp(diffTot)}</div></div><div class="kpi"><div class="l">Perlu dicek</div><div class="v" style="font-size:14px">${noProof} keluar tanpa bukti<br>${unrec} non-tunai belum cocok mutasi</div></div></div></div>
   <div class="card"><h2>Buku kas tunai harian</h2><p class="muted">Saldo awal + Masuk − Keluar = Saldo akhir. Bila kas sudah ditutup, saldo awal besok memakai uang fisik.</p><div class="tblw"><table><tr><th>Tanggal</th><th class="n">Saldo awal</th><th class="n">Masuk</th><th class="n">Keluar</th><th class="n">Saldo akhir</th><th class="n">Fisik / selisih</th></tr>
   ${rows.map(r=>`<tr><td>${fmtD(r.day)}</td><td class="n">${rp(r.op)}</td><td class="n amt in">${rp(r.ci)}</td><td class="n amt out">${rp(r.co)}</td><td class="n"><b>${rp(r.ex)}</b></td><td class="n">${r.c?`${rp(r.c.counted)}<br><span style="color:${Number(r.c.diff)===0?'var(--g2)':(Number(r.c.diff)<0?'var(--r)':'var(--a)')}">${Number(r.c.diff)===0?'cocok':rp(r.c.diff)}</span>`:'<span class="muted">belum ditutup</span>'}</td></tr>`).join('')}</table></div></div>
   ${tbl('Per metode pembayaran',grp(t=>METHODS[t.method]+(t.account?' · '+t.account:'')))}
   ${tbl('Per kategori',grp(t=>catName(t.category_id)))}
   ${tbl('Per pencatat (staf)',grp(t=>nameOf(t.recorded_by)))}
   ${tbl('Per objek transaksi (teratas)',grp(t=>t.object).slice(0,15))}`;
}
function csv(){const tx=S._rep||[];if(!tx.length)return toast('Buat laporan dulu');
  const h=['Tanggal','Jam catat','Jenis','Metode','Rekening/akun','Nominal','Objek','Kategori','Dari/Kepada','Yang bertransaksi','Dicatat oleh','Ada bukti','Cocok mutasi','Keterangan'];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const lines=[h.map(q).join(';')].concat(tx.map(t=>[t.trx_date,fmtT(t.created_at),t.direction==='in'?'Masuk':'Keluar',METHODS[t.method],t.account,t.amount,t.object,catName(t.category_id),t.counterparty,t.actor_name,nameOf(t.recorded_by),t.proof_path?'Ya':'Tidak',t.method==='tunai'?'-':(t.reconciled?'Ya':'Belum'),t.note].map(q).join(';')));
  const b=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`KasJaga_${$('#rF').value}_${$('#rT').value}.csv`;a.click()}

  if(!name)return toast('Nama kategori tidak boleh kosong');
  if(S.cats.some(x=>x.id!==id&&x.direction===dir&&x.name.toLowerCase()===name.toLowerCase()))return toast('Kategori dengan nama itu sudah ada');
  if(dir!==c.direction){const n=await catUsage(id);if(n>0)return toast(`Jenis tidak bisa diubah: kategori ini sudah dipakai ${n} transaksi. Ubah namanya saja, atau buat kategori baru.`)}
  const {error}=await sb.from('categories').update({name,direction:dir}).eq('id',id).eq('business_id',S.biz.id);if(error)return toast(errMsg(error));
  await reloadCats();toast('Kategori diperbarui');viewTim()}
async function delCat(id){const c=S.cats.find(x=>x.id===id);if(!c)return;const n=await catUsage(id);
  const msg=n>0?`Hapus kategori "${esc(c.name)}"? Kategori ini dipakai ${n} transaksi. Transaksinya tetap ada, tetapi kategorinya menjadi kosong (—).`:`Hapus kategori "${esc(c.name)}"?`;
  if(!await confirmBox(msg,'Hapus'))return;
  const {error}=await sb.from('categories').delete().eq('id',id).eq('business_id',S.biz.id);if(error)return toast(errMsg(error));
  await reloadCats();toast('Kategori dihapus');viewTim()}
async function toggleMem(uid,v){const {error}=await sb.from('members').update({active:v}).eq('business_id',S.biz.id).eq('user_id',uid);if(error)return toast(errMsg(error));toast(v?'Staf diaktifkan':'Staf dinonaktifkan');viewTim()}

sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT')viewAuth()});
boot();
</script>
