<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>OwnerKas Pro — Kendali Keuangan Usaha</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--p:#1e3a8a;--p2:#2563eb;--pl:#e8efff;--g:#15803d;--gl:#e7f6ec;--r:#b42318;--rl:#fdecea;--a:#b54708;--al:#fff4e5;--t:#1d2939;--m:#667085;--b:#e4e7ec;--bg:#f5f7fb}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit}
.wrap{max-width:780px;margin:0 auto;padding:12px 14px 92px}
header.top{background:var(--p);color:#fff;padding:12px 14px;position:sticky;top:0;z-index:5}
header.top .row{max-width:780px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-weight:800;letter-spacing:.3px;cursor:default}.brand small{display:block;font-weight:400;opacity:.85;font-size:12px}
.card{background:#fff;border:1px solid var(--b);border-radius:14px;padding:14px;margin:10px 0}
h2{font-size:17px;margin:4px 0 10px}h3{font-size:15px;margin:12px 0 6px}
label{display:block;font-size:13px;color:var(--m);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--b);border-radius:10px;background:#fff}
input[type=checkbox]{width:auto;margin-right:6px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--p2);border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:10px;border:0;background:var(--p2);color:#fff;font-weight:600;cursor:pointer;text-decoration:none}
.btn.full{width:100%}.btn.sec{background:#fff;color:var(--t);border:1px solid var(--b)}.btn.red{background:var(--r)}.btn.grn{background:var(--g)}.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.6}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:10px;border:1px solid var(--b);border-radius:10px;background:#fff;cursor:pointer;font-weight:600}
.seg button.on{background:var(--pl);border-color:var(--p2);color:var(--p)}
.seg button.on.in{background:var(--gl);border-color:var(--g);color:var(--g)}.seg button.on.out{background:var(--rl);border-color:var(--r);color:var(--r)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:#fff;border:1px solid var(--b);border-radius:12px;padding:10px}.kpi .l{font-size:12px;color:var(--m)}.kpi .v{font-size:18px;font-weight:700}
.muted{color:var(--m);font-size:13px}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.tag.in{background:var(--gl);color:var(--g)}.tag.out{background:var(--rl);color:var(--r)}.tag.w{background:var(--al);color:var(--a)}.tag.p{background:var(--pl);color:var(--p)}.tag.x{background:#f2f4f7;color:var(--m)}
.list .it{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--b)}
.list .it:last-child{border:0}.amt{font-weight:700;white-space:nowrap}.amt.in{color:var(--g)}.amt.out{color:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 6px;border-bottom:1px solid var(--b);text-align:left;vertical-align:top}th{color:var(--m);font-weight:600}td.n,th.n{text-align:right}
.tblw{overflow-x:auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--b);display:flex;justify-content:center;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;max-width:780px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:9px 2px 10px;font-size:11.5px;color:var(--m);cursor:pointer;position:relative}
nav.tabs button b{display:block;font-size:18px}
nav.tabs button.on{color:var(--p);font-weight:700}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--r);color:#fff;border-radius:99px;font-size:10.5px;font-weight:700;padding:1px 6px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#101828;color:#fff;padding:10px 14px;border-radius:10px;z-index:50;max-width:90%;display:none}
.modal{position:fixed;inset:0;background:rgba(16,24,40,.55);display:none;align-items:flex-end;justify-content:center;z-index:40}
.modal .box{background:#fff;width:100%;max-width:580px;border-radius:16px 16px 0 0;padding:16px;max-height:90vh;overflow:auto}
@media(min-width:640px){.modal{align-items:center}.modal .box{border-radius:16px}}
.hide{display:none!important}
.alert{padding:10px 12px;border-radius:10px;font-size:13px}.alert.w{background:var(--al);color:var(--a)}.alert.ok{background:var(--gl);color:var(--g)}.alert.e{background:var(--rl);color:var(--r)}.alert.i{background:var(--pl);color:var(--p)}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.wrapf{flex-wrap:wrap}
.code{font:700 22px/1 ui-monospace,monospace;letter-spacing:3px;background:var(--pl);color:var(--p);padding:10px 14px;border-radius:10px;display:inline-block}
.photo{width:100%;border-radius:10px;margin-top:6px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu button{background:#fff;border:1px solid var(--b);border-radius:14px;padding:16px 12px;text-align:left;cursor:pointer;position:relative}
.menu button b{display:block;font-size:22px;margin-bottom:6px}.menu button span{font-weight:700}.menu button small{display:block;color:var(--m);font-size:12px;margin-top:2px}
.menu .badge{top:10px;left:auto;right:10px}
.acc{border:1px solid var(--b);border-radius:12px;padding:12px;margin:8px 0}
@media print{header.top,nav.tabs,.noprint,.btn{display:none!important}.wrap{padding:0}.card{border:0}}
</style>
</head>
<body>
<header class="top"><div class="row">
  <div class="brand">OwnerKas Pro<small id="bizName">Uang usaha tercatat, owner tetap pegang kendali</small></div>
  <div class="row"><span id="whoami" class="muted" style="color:#dbe6ff"></span><button id="btnOut" class="btn sm sec hide" onclick="logout()">Keluar</button></div>
</div></header>

<main class="wrap" id="app"></main>
<nav class="tabs hide" id="tabs"><div class="in" id="tabsIn"></div></nav>
<div class="toast" id="toast"></div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="box" id="modalBox"></div></div>

<script>
const SUPABASE_URL='https://fiveybwfffodhgssgdsc.supabase.co';
const SUPABASE_KEY='sb_publishable_Z2XfKu7ITQsFn3Pc43GMvA_tKZk8b5Y';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const METHODS={tunai:'Tunai',transfer:'Transfer bank',qris:'QRIS',edc:'EDC/Kartu',ewallet:'E-wallet',dana:'DANA',grab:'Grab',gojek:'Gojek',lainnya:'Lainnya'};
const SOURCES={kasbon:'Kasbon',piutang:'Piutang',hutang:'Hutang',pindah:'Pindah dana'};
const BTYPE={dagang:'Perdagangan (jual barang)',jasa:'Jasa',campuran:'Barang & jasa'};
const S={user:null,mems:[],biz:null,role:null,cats:[],members:[],accs:[],branches:[],br:null,pend:0,tab:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>{const v=Number(n||0);return (v<0?'−':'')+'Rp'+Math.abs(v).toLocaleString('id-ID',{maximumFractionDigits:0})};
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta'}).format(new Date());
const addDays=(d,n)=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const dayDiff=(a,b)=>Math.round((new Date(a+'T00:00:00Z')-new Date(b+'T00:00:00Z'))/864e5);
const fmtD=d=>new Date(d+'T00:00:00').toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const fmtDs=d=>new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
const fmtT=t=>new Date(t).toLocaleString('id-ID',{timeZone:'Asia/Jakarta',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const num=v=>Number(String(v||'').replace(/[^\d]/g,''))||0;
const isOwner=()=>S.role==='owner';
function toast(m,ms=2800){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',ms)}
function openModal(h){$('#modalBox').innerHTML=h;$('#modal').style.display='flex'}
function closeModal(){$('#modal').style.display='none'}
function confirmBox(msg,okLabel='Ya, lanjut',danger=true){return new Promise(res=>{openModal(`<h2>Konfirmasi</h2><p>${msg}</p><div class="row" style="justify-content:flex-end"><button class="btn sec" id="cNo">Batal</button><button class="btn ${danger?'red':''}" id="cYes">${okLabel}</button></div>`);$('#cNo').onclick=()=>{closeModal();res(false)};$('#cYes').onclick=()=>{closeModal();res(true)}})}
function errMsg(e){const m=(e&&(e.message||e.error_description))||String(e);
  if(/Invalid login/i.test(m))return 'Email atau password salah.';
  if(/already registered/i.test(m))return 'Email sudah terdaftar. Silakan masuk.';
  if(/Password should be/i.test(m))return 'Password minimal 6 karakter.';
  if(/row-level security/i.test(m))return 'Anda tidak punya akses untuk tindakan ini.';
  if(/Failed to fetch/i.test(m))return 'Koneksi internet terputus. Coba lagi.';
  return m}
function moneyInput(el){if(!el)return;el.addEventListener('input',()=>{const n=num(el.value);el.value=n?n.toLocaleString('id-ID'):''})}
const fmtMoney=v=>v?Number(v).toLocaleString('id-ID'):'';
const last4=s=>s?String(s).slice(-4):'';
function accLabel(a,full){if(!a)return '—';return a.bank_name+(a.account_no?(full&&isOwner()?' '+a.account_no:' ••'+last4(a.account_no)):'')+(full&&a.holder_name?' a.n. '+a.holder_name:'')}
const accById=id=>S.accs.find(a=>a.id===id);
function accOptions(sel,withNone=true,onlyActive=true){return (withNone?`<option value="">— tanpa rekening —</option>`:'')+S.accs.filter(a=>!onlyActive||a.active||a.id===sel).map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${esc(accLabel(a))}</option>`).join('')}
function methodOptions(sel,extra=''){return Object.entries(METHODS).map(([k,v])=>`<option value="${k}" ${sel===k?'selected':''}>${v}</option>`).join('')+extra}
/* payment picker: method + account; returns {method,acc} */
const actBr=()=>S.branches.filter(b=>b.active);
const multiBr=()=>actBr().length>1;
const brName=id=>(S.branches.find(b=>b.id===id)||{}).name||'—';
const mainBr=()=>(actBr()[0]||S.branches[0]||{}).id;
function brOptions(sel,withAll){return (withAll?`<option value="">Semua cabang</option>`:'')+S.branches.filter(b=>b.active||b.id===sel).map(b=>`<option value="${b.id}" ${b.id===sel?'selected':''}>${esc(b.name)}</option>`).join('')}
function brBar(fn){if(!isOwner()||!multiBr())return '';return `<div class="card noprint" style="padding:10px 14px"><div class="row"><span class="muted" style="white-space:nowrap">Cabang</span><select id="brSel" onchange="S.br=this.value||null;${fn}">${brOptions(S.br,true)}</select></div></div>`}
function payPicker(prefix,{method='tunai',acc=null,potong=false,br=null,nobr=false}={}){
  return `<div class="grid2"><div><label>Metode</label><select id="${prefix}Met">${methodOptions(method,potong?'<option value="potong_gaji">Potong gaji (tanpa uang)</option>':'')}</select></div>
   <div id="${prefix}AccW"><label>Rekening</label><select id="${prefix}Acc">${accOptions(acc)}</select></div>
   ${!nobr&&isOwner()&&multiBr()?`<div id="${prefix}BrW"><label>Kas cabang</label><select id="${prefix}Br">${brOptions(br||S.br||mainBr())}</select></div>`:''}</div>`}
function bindPayPicker(prefix){const f=()=>{const m=$('#'+prefix+'Met').value;$('#'+prefix+'AccW').classList.toggle('hide',m==='tunai'||m==='potong_gaji');const bw=$('#'+prefix+'BrW');if(bw)bw.classList.toggle('hide',m!=='tunai')};$('#'+prefix+'Met').onchange=f;f()}
function readPay(prefix){const m=$('#'+prefix+'Met').value;const a=(m==='tunai'||m==='potong_gaji')?null:($('#'+prefix+'Acc').value||null);
  if(m==='transfer'&&!a)throw new Error('Pilih rekening untuk metode transfer. Tambahkan rekening di menu Rekening Bank.');
  const b=$('#'+prefix+'Br');return {method:m,acc:a,br:b&&m==='tunai'?b.value:null}}

/* ---------- AUTH ---------- */
function viewAuth(mode='login'){
  $('#tabs').classList.add('hide');$('#btnOut').classList.add('hide');$('#whoami').textContent='';
  $('#app').innerHTML=`<div class="card" style="margin-top:24px">
  <h2>${mode==='login'?'Masuk ke OwnerKas Pro':'Daftar akun baru'}</h2>
  <p class="muted">${mode==='login'?'Owner dan karyawan masuk lewat halaman yang sama.':'Owner: daftar lalu masukkan kode aktivasi dari email pembelian. Karyawan: daftar lalu masukkan kode usaha dari owner.'}</p>
  <label>Email</label><input id="aEmail" type="email" autocomplete="email" placeholder="nama@email.com">
  <label>Password</label><input id="aPass" type="password" autocomplete="${mode==='login'?'current-password':'new-password'}" placeholder="minimal 6 karakter">
  <div style="height:12px"></div>
  <button class="btn full" id="aBtn">${mode==='login'?'Masuk':'Daftar'}</button>
  <p class="muted" style="text-align:center;margin-top:12px">${mode==='login'?'Belum punya akun? <a href="#" id="aSw">Daftar</a>':'Sudah punya akun? <a href="#" id="aSw">Masuk</a>'}</p>
  </div>`;
  $('#aSw').onclick=e=>{e.preventDefault();viewAuth(mode==='login'?'signup':'login')};
  $('#aBtn').onclick=async()=>{const email=$('#aEmail').value.trim(),password=$('#aPass').value;
    if(!email||!password)return toast('Isi email dan password');
    $('#aBtn').disabled=true;
    const r=mode==='login'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});
    $('#aBtn').disabled=false;
    if(r.error)return toast(errMsg(r.error));
    if(mode==='signup'&&!r.data.session)return toast('Cek email Anda untuk konfirmasi, lalu masuk.',5000);
    boot()};
}
async function logout(){await sb.auth.signOut();S.biz=null;viewAuth()}

/* ---------- ONBOARD ---------- */
function viewOnboard(){
  $('#tabs').classList.add('hide');
  $('#app').innerHTML=`<div class="card"><h2>Selamat datang 👋</h2><p class="muted">Akun Anda belum terhubung ke usaha mana pun. Pilih salah satu:</p></div>
  <div class="card"><h3>Saya OWNER (pembeli OwnerKas Pro)</h3>
   <label>Kode aktivasi (dari email/WA pembelian)</label><input id="oCode" placeholder="OKP-XXXX-XXXX" style="text-transform:uppercase">
   <label>Nama usaha</label><input id="oBiz" placeholder="cth. Bengkel Maju Jaya">
   <label>Jenis usaha</label><select id="oType">${Object.entries(BTYPE).map(([k,v])=>`<option value="${k}" ${k==='campuran'?'selected':''}>${v}</option>`).join('')}</select>
   <label>Nama Anda</label><input id="oName" placeholder="cth. Pak Emir">
   <label>Saldo kas tunai saat ini (uang di laci/brankas)</label><input id="oOpen" inputmode="numeric" placeholder="0">
   <p class="muted">Rekening bank dan e-wallet ditambahkan setelah aktif, di menu Rekening Bank.</p>
   <button class="btn full" id="oBtn">Aktifkan usaha</button></div>
  <div class="card"><h3>Saya KARYAWAN (kasir/admin/keuangan)</h3>
   <label>Kode usaha (minta ke owner)</label><input id="sCode" placeholder="8 karakter" style="text-transform:uppercase">
   <label>Nama Anda</label><input id="sName" placeholder="cth. Rina (kasir)">
   <div style="height:12px"></div><button class="btn full sec" id="sBtn">Gabung ke usaha</button></div>`;
  moneyInput($('#oOpen'));
  $('#oBtn').onclick=async()=>{const c=$('#oCode').value.trim(),b=$('#oBiz').value.trim(),n=$('#oName').value.trim();
    if(!c||!b||!n)return toast('Lengkapi kode, nama usaha, dan nama Anda');
    const {error}=await sb.rpc('activate_business',{license_code:c,biz_name:b,owner_name:n,opening:num($('#oOpen').value),btype:$('#oType').value});
    if(error)return toast(errMsg(error));toast('Usaha aktif!');boot()};
  $('#sBtn').onclick=async()=>{const c=$('#sCode').value.trim(),n=$('#sName').value.trim();
    if(!c||!n)return toast('Isi kode usaha dan nama Anda');
    const {error}=await sb.rpc('join_business',{code:c,staff_name:n});
    if(error)return toast(errMsg(error));toast('Berhasil bergabung');boot()};
}

/* ---------- BOOT ---------- */
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return viewAuth();
  S.user=session.user;$('#btnOut').classList.remove('hide');
  const {data,error}=await sb.from('members').select('business_id,role,display_name,active,businesses(*)').eq('user_id',S.user.id);
  if(error)return toast(errMsg(error));
  S.mems=(data||[]).filter(m=>m.active);
  if(!S.mems.length){ if((data||[]).length){$('#app').innerHTML='<div class="card"><h2>Akses dinonaktifkan</h2><p class="muted">Akun Anda dinonaktifkan oleh owner. Hubungi owner usaha.</p></div>';return} return viewOnboard();}
  let saved=null;try{saved=localStorage.getItem('okp_biz')}catch(e){}
  const m=S.mems.find(x=>x.business_id===saved)||S.mems[0];
  await selectBiz(m.business_id);
}
async function selectBiz(id){
  const m=S.mems.find(x=>x.business_id===id);S.biz=m.businesses;S.role=m.role;S.me=m.display_name;
  try{localStorage.setItem('okp_biz',id)}catch(e){}
  $('#bizName').textContent=S.biz.name+(S.mems.length>1?' ▾':'');$('#bizName').onclick=S.mems.length>1?pickBiz:null;
  S.br=null;await Promise.all([reloadCats(),reloadAccs(),reloadBranches()]);
  $('#whoami').textContent=S.me+(isOwner()?' · Owner':' · '+(S.branches[0]?S.branches[0].name:'Karyawan'));
  if(isOwner()){const {data:mm}=await sb.from('members').select('user_id,display_name,role,active,created_at').eq('business_id',id);S.members=mm||[]}
  else S.members=[{user_id:S.user.id,display_name:S.me}];
  buildTabs();
}
async function reloadBiz(){const {data}=await sb.from('businesses').select('*').eq('id',S.biz.id).single();if(data){S.biz=data;const m=S.mems.find(x=>x.business_id===data.id);if(m)m.businesses=data}}
const catRank=c=>/^(Ambil uang owner|Setoran modal owner|Lain-lain)/.test(c.name)?1:0;
async function reloadCats(){const {data}=await sb.from('categories').select('*').eq('business_id',S.biz.id).order('name');S.cats=(data||[]).sort((a,b)=>catRank(a)-catRank(b)||a.name.localeCompare(b.name,'id'))}
async function reloadBranches(){const {data}=await sb.from('branches').select('*').eq('business_id',S.biz.id).order('created_at');S.branches=data||[]}
async function reloadAccs(){const {data}=await sb.from('bank_accounts').select('*').eq('business_id',S.biz.id).order('bank_name');S.accs=data||[]}
async function refreshPending(){if(!isOwner())return;const {count}=await sb.from('transactions').select('id',{count:'exact',head:true}).eq('business_id',S.biz.id).eq('status','pending');S.pend=count||0;
  const b=document.querySelector('#tabsIn button[data-t="menu"]');if(b){b.querySelector('.badge')?.remove();if(S.pend)b.insertAdjacentHTML('beforeend',`<span class="badge">${S.pend}</span>`)}}
function pickBiz(){openModal(`<h2>Pilih usaha</h2>${S.mems.map(m=>`<button class="btn sec full" style="margin:4px 0" onclick="closeModal();selectBiz('${m.business_id}')">${esc(m.businesses.name)} · ${m.role==='owner'?'Owner':'Karyawan'}</button>`).join('')}`)}
const nameOf=uid=>(S.members.find(m=>m.user_id===uid)||{}).display_name||'—';
const catName=id=>(S.cats.find(c=>c.id===id)||{}).name||'—';

function buildTabs(){
  const T=isOwner()
   ?[['dash','🏠','Ringkasan'],['catat','➕','Catat'],['trx','📋','Transaksi'],['tutup','🔒','Tutup Kas'],['menu','☰','Menu']]
   :[['catat','➕','Catat'],['hari','📋','Hari ini']].concat(S.biz.stock_enabled?[['stok','📦','Stok']]:[]).concat([['tutup','🔒','Tutup Kas']]);
  $('#tabsIn').innerHTML=T.map(t=>`<button data-t="${t[0]}"><b>${t[1]}</b>${t[2]}</button>`).join('');
  $('#tabs').classList.remove('hide');
  document.querySelectorAll('#tabsIn button').forEach(b=>b.onclick=()=>go(b.dataset.t));
  go(isOwner()?'dash':'catat');refreshPending();
}
const MENU_OF={rek:1,setuju:1,utang:1,kasbon:1,lap:1,tim:1,cabang:1,stok:1,wa:1};
function go(t){S.tab=t;const tabKey=MENU_OF[t]&&isOwner()?'menu':t;document.querySelectorAll('#tabsIn button').forEach(b=>b.classList.toggle('on',b.dataset.t===tabKey));window.scrollTo(0,0);
  ({dash:viewDash,catat:()=>viewCatat(),trx:viewTrx,tutup:viewTutup,menu:viewMenu,lap:viewLap,tim:viewTim,hari:viewHari,rek:viewRek,setuju:viewSetuju,utang:viewUtang,kasbon:viewKasbon,cabang:viewCabang,stok:viewStok,wa:viewWa})[t]()}

async function compressImage(file){
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)});
  const max=1280,sc=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,'image/jpeg',.72));
}
async function uploadProof(file){const blob=await compressImage(file);const path=`${S.biz.id}/${crypto.randomUUID()}.jpg`;
  const up=await sb.storage.from('proofs').upload(path,blob,{contentType:'image/jpeg'});if(up.error)throw up.error;return path}

async function loadLap(){

    sb.from('cash_closings').select('*').eq('business_id',S.biz.id).gte('close_date',F).lte('close_date',T),
    sb.rpc('account_ledger',{bid:S.biz.id,f:F,t:T}),

  const tx=all.filter(t=>t.status==='approved'),biz=tx.filter(t=>!t.transfer_group);
  const sum=(a,f)=>a.filter(f).reduce((s,t)=>s+Number(t.amount),0);
  const tin=sum(biz,t=>t.direction==='in'),tout=sum(biz,t=>t.direction==='out');
  // cash book per branch, then combine by day
  const byDay={};let diffTot=0;const brSum={};

      if(c){r.counted+=Number(c.counted);r.diff+=Number(c.diff);r.nc++;diffTot+=Number(c.diff);brSum[b.id].d+=Number(c.diff);brSum[b.id].closed++}
      op=c?Number(c.counted):ex;r.end+=op}});

  const noProof=biz.filter(t=>t.direction==='out'&&!t.proof_path&&t.source==='manual').length,unrec=tx.filter(t=>t.method!=='tunai'&&!t.reconciled).length;

  const pi=(ds||[]).filter(x=>x.kind==='piutang'),hu=(ds||[]).filter(x=>x.kind==='hutang');

  $('#rep').innerHTML=`<div class="card"><div class="muted">${esc(S.biz.name)}${scope?' · '+scope:''} · ${fmtD(F)} – ${fmtD(T)}</div><h2>Ringkasan</h2>

function csv(){const tx=S._rep||[];if(!tx.length)return toast('Buat laporan dulu');
  const h=['Tanggal','Jam catat','Cabang','Jenis','Status','Sumber','Metode','Rekening','Nominal','Objek','Kategori','Dari/Kepada','Yang bertransaksi','Dicatat oleh','Ada bukti','Cocok mutasi','Keterangan','Catatan persetujuan'];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const st={approved:'Tercatat',pending:'Menunggu persetujuan',rejected:'Ditolak'};
  const lines=[h.map(q).join(';')].concat(tx.map(t=>[t.trx_date,fmtT(t.created_at),brName(t.branch_id),t.direction==='in'?'Masuk':'Keluar',st[t.status],t.source==='manual'?'Catat':SOURCES[t.source],METHODS[t.method],t.account,t.amount,t.object,catName(t.category_id),t.counterparty,t.actor_name,nameOf(t.recorded_by),t.proof_path?'Ya':'Tidak',t.method==='tunai'?'-':(t.reconciled?'Ya':'Belum'),t.note,t.review_note].map(q).join(';')));
  const b=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`OwnerKasPro_${$('#rF').value}_${$('#rT').value}.csv`;a.click()}

  $('#app').innerHTML=`<div class="row sp">${backBtnF()}<div class="row">${owner?`<button class="btn sm sec" onclick="stockHist()">Riwayat</button><button class="btn sm" onclick="formItem()">+ Barang</button>`:''}</div></div>
   ${owner?brBar('viewStok()'):''}
   <div class="card"><h2>Stok barang${!owner&&S.branches[0]?' — '+esc(S.branches[0].name):(S.br?' — '+esc(brName(S.br)):'')}</h2>
   <input id="stQ" placeholder="Cari nama / kode barang" value="${esc(STQ)}"><div class="row" style="margin-top:8px"><label style="margin:0;color:var(--t)"><input type="checkbox" id="stLow"> hanya stok menipis</label></div>
   <div id="stL" class="muted" style="margin-top:8px">Memuat...</div></div>`;
  const {data,error}=await sb.rpc('stock_levels',{bid:S.biz.id,br:owner?S.br:null});if(error)return toast(errMsg(error));
  const items={};(data||[]).forEach(r=>{const it=items[r.item_id]=items[r.item_id]||{id:r.item_id,name:r.name,sku:r.sku,unit:r.unit,min:Number(r.min_stock),price:r.sell_price,active:r.active,rows:[],tot:0};it.rows.push(r);it.tot+=Number(r.qty)});
  S._items=items;
  const render=()=>{const q=$('#stQ').value.trim().toLowerCase();STQ=q;const lowOnly=$('#stLow').checked;
    const list=Object.values(items).filter(i=>(owner||i.active)&&(!q||i.name.toLowerCase().includes(q)||(i.sku||'').toLowerCase().includes(q))&&(!lowOnly||i.rows.some(r=>i.min>0&&Number(r.qty)<=i.min)));
    $('#stL').classList.remove('muted');
    $('#stL').innerHTML=list.length?`<div class="list">${list.map(i=>{const low=i.rows.some(r=>i.min>0&&Number(r.qty)<=i.min);
      return `<div class="it"><div style="min-width:0;flex:1"><b>${esc(i.name)}</b> ${i.active?'':'<span class="tag x">nonaktif</span>'}${low?' <span class="tag w">menipis</span>':''}
      <div class="muted">${i.sku?esc(i.sku)+' · ':''}min ${fmtQty(i.min)} ${esc(i.unit)}${i.price?' · harga '+rp(i.price):''}</div>
      ${i.rows.length>1?`<div class="muted">${i.rows.map(r=>`${esc(r.branch_name)}: <b style="color:${i.min>0&&Number(r.qty)<=i.min?'var(--r)':'inherit'}">${fmtQty(r.qty)}</b>`).join(' · ')}</div>`:''}
      <div class="row wrapf" style="margin-top:6px">${i.active?`<button class="btn sm grn" onclick="formMove('${i.id}','masuk')">+ Masuk</button><button class="btn sm red" onclick="formMove('${i.id}','keluar')">− Keluar</button>`:''}
      ${owner&&i.active?`<button class="btn sm sec" onclick="formMove('${i.id}','opname')">Opname</button>${multiBr()?`<button class="btn sm sec" onclick="formStTransfer('${i.id}')">Pindah</button>`:''}<button class="btn sm sec" onclick="formItem('${i.id}')">Ubah</button>`:''}${owner&&!i.active?`<button class="btn sm sec" onclick="formItem('${i.id}')">Ubah</button>`:''}</div></div>
      <div style="text-align:right"><div class="muted">${i.rows.length>1?'Total':'Stok'}</div><b style="font-size:18px;color:${low?'var(--r)':'inherit'}">${fmtQty(i.tot)}</b><div class="muted">${esc(i.unit)}</div></div></div>`}).join('')}</div>`
      :`<p class="muted">${Object.keys(items).length?'Tidak ada barang yang cocok.':(owner?'Belum ada barang. Tambahkan barang dulu, lalu catat stok masuk.':'Owner belum menambahkan barang.')}</p>`};
  $('#stQ').oninput=render;$('#stLow').onchange=render;render();
}
function formItem(id){const i=id?S._items[id]:{unit:'pcs',min:0,active:true};
  openModal(`<h2>${id?'Ubah barang':'Tambah barang'}</h2>
   <label>Nama barang</label><input id="iN" value="${esc(i.name||'')}" placeholder="cth. Oli mesin 1L" maxlength="80">
   <div class="grid2"><div><label>Kode/SKU (opsional)</label><input id="iS" value="${esc(i.sku||'')}" maxlength="40"></div><div><label>Satuan</label><input id="iU" value="${esc(i.unit)}" placeholder="pcs / botol / kg" maxlength="20"></div></div>
   <div class="grid2"><div><label>Stok minimum (peringatan)</label><input id="iM" inputmode="decimal" value="${i.min||''}" placeholder="0"></div><div><label>Harga jual (opsional)</label><input id="iP" inputmode="numeric" value="${fmtMoney(i.price)}"></div></div>
   ${id?`<label style="color:var(--t)"><input type="checkbox" id="iA" ${i.active?'checked':''}> Barang aktif</label>`:'<p class="muted">Setelah disimpan, catat stok awal lewat tombol "+ Masuk" atau "Opname".</p>'}
   <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn sec" onclick="closeModal()">Batal</button><button class="btn" id="iOk">Simpan</button></div>`);
  moneyInput($('#iP'));
  $('#iOk').onclick=async()=>{const row={name:$('#iN').value.trim(),sku:$('#iS').value.trim()||null,unit:$('#iU').value.trim()||'pcs',min_stock:Number(String($('#iM').value).replace(',','.'))||0,sell_price:$('#iP').value?num($('#iP').value):null};
    if(!row.name)return toast('Isi nama barang');if(id)row.active=$('#iA').checked;
    const r=id?await sb.from('items').update(row).eq('id',id):await sb.from('items').insert({...row,business_id:S.biz.id});
    if(r.error)return toast(/duplicate|unique/i.test(r.error.message)?'Nama barang sudah ada':errMsg(r.error));closeModal();toast('Barang tersimpan');viewStok()}}
function formMove(id,kind){const i=S._items[id];const owner=isOwner();const lbl={masuk:'Stok masuk',keluar:'Stok keluar',opname:'Stok opname (hitung fisik)'}[kind];
  const br=owner?(S.br||mainBr()):null;const cur=r=>Number((i.rows.find(x=>x.branch_id===r)||i.rows[0]||{qty:0}).qty);
  openModal(`<h2>${lbl}</h2><p><b>${esc(i.name)}</b><br><span class="muted" id="mvCur">Stok saat ini: ${fmtQty(owner?cur(br):i.tot)} ${esc(i.unit)}</span></p>
   ${owner&&multiBr()?`<label>Cabang</label><select id="mvB">${brOptions(br)}</select>`:''}
   <div class="grid2"><div><label>${kind==='opname'?'Jumlah fisik sekarang':'Jumlah'} (${esc(i.unit)})</label><input id="mvQ" inputmode="decimal" placeholder="0"></div>
   ${owner?`<div><label>Tanggal</label><input id="mvD" type="date" value="${today()}" max="${today()}"></div>`:''}</div>
   <label>Catatan (opsional)</label><input id="mvN" placeholder="${kind==='masuk'?'cth. Kulakan dari supplier':kind==='keluar'?'cth. Terjual / dipakai servis':'cth. Hitung stok akhir bulan'}">
   <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn sec" onclick="closeModal()">Batal</button><button class="btn" id="mvOk">Simpan</button></div>`);
  if($('#mvB'))$('#mvB').onchange=()=>$('#mvCur').textContent=`Stok saat ini: ${fmtQty(cur($('#mvB').value))} ${i.unit}`;
  $('#mvOk').onclick=async()=>{const q=Number(String($('#mvQ').value).replace(',','.'));if(isNaN(q)||$('#mvQ').value===''||(kind!=='opname'&&q<=0))return toast('Isi jumlah');
    const {data,error}=await sb.rpc('stock_move',{bid:S.biz.id,it:id,mkind:kind,qty:q,d:owner?($('#mvD').value||today()):today(),mnote:$('#mvN').value.trim()||null,br:$('#mvB')?$('#mvB').value:br});
    if(error)return toast(errMsg(error));closeModal();toast(`Tersimpan. Stok sekarang ${fmtQty(data)} ${i.unit}`+(data<0?' (minus, cek lagi)':''),4000);viewStok()}}
function formStTransfer(id){const i=S._items[id];const b=actBr();
  openModal(`<h2>Pindah stok antar cabang</h2><p><b>${esc(i.name)}</b><br><span class="muted">${i.rows.map(r=>esc(r.branch_name)+': '+fmtQty(r.qty)).join(' · ')}</span></p>
   <div class="grid2"><div><label>Dari</label><select id="stF">${brOptions(b[0].id)}</select></div><div><label>Ke</label><select id="stT">${brOptions(b[1].id)}</select></div></div>
   <label>Jumlah (${esc(i.unit)})</label><input id="stQn" inputmode="decimal"><label>Catatan (opsional)</label><input id="stN">
   <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn sec" onclick="closeModal()">Batal</button><button class="btn" id="stOk">Pindahkan</button></div>`);
  $('#stOk').onclick=async()=>{const q=Number(String($('#stQn').value).replace(',','.'));if(!q||q<=0)return toast('Isi jumlah');
    const {data,error}=await sb.rpc('stock_transfer',{bid:S.biz.id,it:id,qty:q,from_br:$('#stF').value,to_br:$('#stT').value,d:today(),mnote:$('#stN').value.trim()||null});
    if(error)return toast(errMsg(error));closeModal();toast(data);viewStok()}}
async function stockHist(){let q=sb.from('stock_moves').select('*').eq('business_id',S.biz.id).order('created_at',{ascending:false}).limit(100);if(S.br)q=q.eq('branch_id',S.br);
  const {data,error}=await q;if(error)return toast(errMsg(error));const nm=id=>(S._items&&S._items[id]||{}).name||'—';
  const K={masuk:['in','masuk'],keluar:['out','keluar'],opname:['w','opname'],pindah_masuk:['p','pindah masuk'],pindah_keluar:['p','pindah keluar']};
  openModal(`<h2>Riwayat stok</h2><p class="muted">100 catatan terakhir${S.br?' · '+esc(brName(S.br)):''}.</p><div class="list">${(data||[]).map(m=>`<div class="it"><div><span class="tag ${K[m.kind][0]}">${K[m.kind][1]}</span> <b>${esc(nm(m.item_id))}</b>
   <div class="muted">${fmtDs(m.move_date)}${multiBr()?' · '+esc(brName(m.branch_id)):''} · ${esc(nameOf(m.created_by))}${m.note?' · '+esc(m.note):''}</div></div>
   <div class="row"><b>${m.delta>0?'+':''}${fmtQty(m.delta)}</b><button class="btn sm sec" style="color:var(--r)" onclick="delMove('${m.id}')">Hapus</button></div></div>`).join('')||'<p class="muted">Belum ada catatan stok.</p>'}</div><button class="btn full sec" onclick="closeModal()">Tutup</button>`)}
async function delMove(id){if(!await confirmBox('Hapus catatan stok ini? Stok dihitung ulang. Pindah stok terhapus kedua sisinya.','Hapus'))return;
  const {data,error}=await sb.rpc('delete_stock_move',{mid:id});if(error)return toast(errMsg(error));closeModal();toast(data);viewStok()}

sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT')viewAuth()});
boot();
</script>
</body>
</html>
